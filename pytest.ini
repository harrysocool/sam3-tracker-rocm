[pytest]
# Historical GPU experiments under eval/ are explicit tools, not unit tests.
testpaths = tests
# host_only tests launch docker, so they cannot run inside the container.
# They are deselected by default; run them on the host with `-m host_only`.
markers =
    host_only: needs docker, ROCm device nodes and the release image on the host
addopts = -m "not host_only"
